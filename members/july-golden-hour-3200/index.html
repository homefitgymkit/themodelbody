<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golden Hour Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F3EB">
<title>Golden Hour Training Plan</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #cfc6b6; overflow-x: hidden; }
  body { display: block; }
  #shell { position: relative; width: 100vw; min-height: 100dvh; overflow: hidden; background: #cfc6b6; }
  .viewer { position: absolute; top: 0; left: 50%; width: 1080px; height: 24000px; border: 0; background: #cfc6b6; transform-origin: top center; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #1A1410; text-align: center; padding: 24px; background: #F8F3EB; }
  .fallback a { color: #B5132A; }
</style>
</head>
<body>
<div id="shell"><iframe class="viewer" id="planFrame" title="Golden Hour Training Plan" src="./training-plan.html"></iframe></div>
<noscript><div class="fallback"><div><div style="font-size:48px;">🍒</div><p>Open the Golden Hour Training Plan</p><p><a href="./training-plan.html">Tap here</a></p></div></div></noscript>
<script>
(function () {
  var BASE_WIDTH = 1080;
  var frame = document.getElementById('planFrame');
  var shell = document.getElementById('shell');
  function fitFrame() {
    var scale = window.innerWidth / BASE_WIDTH;
    frame.style.transform = 'translateX(-50%) scale(' + scale + ')';
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      var h = Math.max(
        doc.documentElement.scrollHeight || 0,
        doc.body ? doc.body.scrollHeight : 0,
        1350
      );
      frame.style.height = h + 'px';
      shell.style.height = Math.ceil(h * scale) + 'px';
    } catch (e) {
      shell.style.height = Math.ceil(24000 * scale) + 'px';
    }
  }
  frame.addEventListener('load', function () {
    setTimeout(fitFrame, 150);
    setTimeout(fitFrame, 700);
    setTimeout(fitFrame, 1600);
  });
  window.addEventListener('resize', function () { setTimeout(fitFrame, 150); });
  window.addEventListener('orientationchange', function () { setTimeout(fitFrame, 500); });
  fitFrame();
})();
</script>
</body>
</html>
