<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#cfc6b6;overflow-x:hidden;-webkit-text-size-adjust:100%;}
#shell{position:relative;width:100vw;min-height:100dvh;overflow:hidden;background:#cfc6b6;}
#planFrame{position:absolute;top:0;left:50%;width:1080px;height:24000px;border:0;background:#cfc6b6;transform-origin:top center;}
</style>
</head>
<body>
<div id="shell"><iframe id="planFrame" title="The Reset Meal Plan" src="./meal-plan.html"></iframe></div>
<script>
(function(){
var base=1080, fallback=24000, frame=document.getElementById('planFrame'), shell=document.getElementById('shell');
function vw(){var a=[window.innerWidth,document.documentElement.clientWidth,window.visualViewport?window.visualViewport.width:0].filter(Boolean);return Math.max(320,Math.min.apply(null,a));}
function fit(){var scale=vw()/base;frame.style.transform='translate3d(-50%,0,0) scale('+scale+')';try{var d=frame.contentDocument||frame.contentWindow.document;var h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0,1350);frame.style.height=h+'px';shell.style.height=Math.ceil(h*scale)+'px';}catch(e){shell.style.height=Math.ceil(fallback*scale)+'px';}document.documentElement.scrollLeft=0;document.body.scrollLeft=0;shell.scrollLeft=0;}
function many(){fit();[100,300,700,1200,2200,3500].forEach(function(t){setTimeout(fit,t);});}
frame.onload=many;window.onload=many;window.onpageshow=many;window.onresize=function(){setTimeout(many,100)};window.onorientationchange=function(){setTimeout(many,500)};document.addEventListener('visibilitychange',function(){if(!document.hidden)many();});document.addEventListener('touchstart',function(){setTimeout(fit,50)},{passive:true});if(window.visualViewport){visualViewport.addEventListener('resize',many);visualViewport.addEventListener('scroll',fit);}many();
})();
</script>
</body>
